<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  color:#fff;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 100% at 82% -10%,rgba(227,0,27,.20),transparent 55%),radial-gradient(90% 90% at 10% 110%,rgba(0,43,92,.55),transparent 60%),#001A3C}
.box{width:100%;max-width:390px;padding:38px 34px;text-align:center}
.dot{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#002B5C,#1A4A8C);margin:0 auto 22px;

  box-shadow:0 10px 26px rgba(0,43,92,.5);border:2px solid rgba(227,0,27,.4)}

h1{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:7px}
.sub{font-size:13px;color:#a6adc4;margin-bottom:26px;line-height:1.55}
form{display:flex;flex-direction:column;gap:12px}
input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid #2b3a63;
  background:#0D1F3C;color:#fff;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:#E3001B;box-shadow:0 0 0 3px rgba(227,0,27,.20)}
button{padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#002B5C,#1A4A8C);color:#fff;
  font-weight:800;font-size:15px;cursor:pointer;transition:filter .15s,transform .15s;border:1px solid rgba(227,0,27,.3)}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button:disabled{opacity:.6;cursor:default;transform:none}
.err{min-height:18px;font-size:12.5px;color:#ff8fa0;margin-top:2px}
.foot{margin-top:26px;font-size:11px;letter-spacing:.02em;color:#57608a}
</style></head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const f = document.getElementById('f'), p = document.getElementById('p'),
      e = document.getElementById('e'), b = document.getElementById('b');
async function unlock(pw){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(CFG.s), iterations:CFG.n, hash:'SHA-256'},
    baseKey, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(CFG.i)}, key, b64(CFG.d));
  const html = new TextDecoder().decode(buf);
  try { sessionStorage.setItem('bkpw', pw); } catch(_) {}
  document.open(); document.write(html); document.close();
}
f.addEventListener('submit', async (ev) => {
  ev.preventDefault(); e.textContent=''; b.disabled=true; b.textContent='Unlocking...';
  try { await unlock(p.value); }
  catch (err) { e.textContent = 'Incorrect password. Please try again.';
    b.disabled=false; b.textContent='View presentation'; p.select(); }
});
(async () => { try { const s = sessionStorage.getItem('bkpw'); if (s) await unlock(s); } catch(_){} })();
